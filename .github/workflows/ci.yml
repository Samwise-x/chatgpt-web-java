name: deterministic-acceptance
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  checks:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --no-audit --no-fund
      - name: Normalize source formatting in the build
        run: npm run format
      - name: Emit normalized tracked files for exact source sync
        run: |
          node - <<'NODE'
          const fs = require("node:fs");
          const cp = require("node:child_process");
          const paths = cp.execFileSync("git",["diff","--name-only","--"],{encoding:"utf8"}).trim().split("\n").filter(Boolean);
          for(const path of paths) console.log("FORMATTED_SOURCE="+JSON.stringify({path,content:fs.readFileSync(path,"utf8")}));
          NODE
      - run: npm run check
      - run: npm run test:negative
      - run: npm run package:plugin
      - name: Check the extracted release ZIP
        run: |
          mkdir -p build/extracted
          python3 -m zipfile -e build/chatgpt-web-java-plugin.zip build/extracted
          cd build/extracted
          node examples/cross-service-correlation/01.mjs
          node --test tests/audit-regressions.test.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: chatgpt-web-java-plugin
          path: build/chatgpt-web-java-plugin.zip
