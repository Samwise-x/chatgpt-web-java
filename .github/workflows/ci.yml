name: deterministic-acceptance
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  checks:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --no-audit --no-fund
      - name: Normalize and commit formatting
        if: github.event_name == 'push'
        run: |
          npm run format
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -u
          git diff --cached --quiet || HUSKY=0 git -c core.hooksPath=/dev/null commit -m "style: normalize audit correction"
          git push
      - run: npm run check
      - run: npm run test:negative
      - run: npm run package:plugin
      - name: Check the extracted release ZIP
        run: |
          mkdir -p build/extracted
          python3 -m zipfile -e build/chatgpt-web-java-plugin.zip build/extracted
          cd build/extracted
          node examples/cross-service-correlation/01.mjs
          node --test tests/audit-regressions.test.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: chatgpt-web-java-plugin
          path: build/chatgpt-web-java-plugin.zip
